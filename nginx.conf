server {
    # Listen on port 80 inside the container
    listen 80;

    # Serve files from this directory
    # (this is where we'll COPY the dist/ folder to)
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    location / {
        # This is the CRITICAL line for SPAs.
        #
        # When someone visits /dashboard or /bookings, Nginx looks for
        # a file called /dashboard/index.html — which doesn't exist!
        # React Router handles those routes on the CLIENT side.
        #
        # try_files does this:
        #   1. Try the exact file ($uri)         → e.g., /assets/style.css ✓
        #   2. Try as a directory ($uri/)         → e.g., /images/ ✓
        #   3. Fall back to /index.html           → React Router takes over ✓
        #
        # Without this, refreshing any page except "/" gives a 404!
        # (This is exactly what your netlify.toml's [[redirects]] does)
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for 1 year.
    # Vite adds content hashes to filenames (e.g., index-BxK3a9f.js),
    # so a new build = new filename = cache automatically busted.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html itself.
    # This ensures users always get the latest version,
    # which then loads the correct hashed JS/CSS files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
